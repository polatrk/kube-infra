apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sampleapp-ingress
  namespace: sampleapp
  labels:
    app.kubernetes.io/name: sampleapp-ingress
spec:
  rules:
  - host: sampleapp.com
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: sampleapp-svc
            port: 
              number: 80
