apiVersion: v1
kind: Service
metadata:
  name: sampleapp-svc
  namespace: sampleapp
spec:
  selector:
    app: sampleapp
  ports:
  - port: 8081
    targetPort: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sampleapp-deployment
  namespace: sampleapp
spec:
  selector:
    matchLabels:
      app: sampleapp
  template:
    metadata:
      labels:
        app: sampleapp
    spec:
      containers:
      - name: sampleapp
        image: 192.168.49.1/kube/sampleapp:v1
        env:
        - name: APP_DEBUG
          value: "true"
        - name: APP_ENV
          value: "dev"
        - name: APP_KEY
          value: "xxxxxx"
        - name: DB_CONNECTION
          value: "mysql"
        - name: DB_HOST
          value: mysql-svc
        - name: DB_PORT
          value: "3306"
        - name: DB_DATABASE
          value: "app_database"
        - name: DB_USERNAME
          value: "app_user"
        - name: DB_PASSWORD
          value: "xxxxxx"
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: regcred