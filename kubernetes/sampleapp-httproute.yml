apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: sampleapp-route
  namespace: sampleapp
spec:
  parentRefs:
    - name: traefik-gateway
      sectionName: sampleapp-web
      namespace: sampleapp
  hostnames:
    - sampleapp.com
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: sampleapp-svc
          port: 8081