apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-sts
  namespace: sampleapp
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql-svc
  replicas: 1
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: mysql:8.4
        name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_ROOT_PASSWORD
        - name: MYSQL_DATABASE
          value: "app_database"
        - name: MYSQL_USER
          value: "app_user"
        - name: MYSQL_PASSWORD
          value: "xxxxxxxxx"
        - name: MYSQL_TCP_PORT
          value: "3306"
        - name: APP_DB_PASSWORD
          value: "xxxxxxxxx"
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-pvc
          mountPath: /var/lib/mysql
        resources:
          requests:
            cpu: "250m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
  volumeClaimTemplates:
  - metadata:
      name: mysql-pvc
    spec:
      resources:
        requests:
          storage: 2Gi
      storageClassName: standard # on aurait utilisé mysql-ebs-sc mais là sur minikube y a le provisioner hostpath donc pr le local est sur hostpath 
      accessModes: ["ReadWriteOnce"]