plugin: amazon.aws.aws_ec2
regions:
  - eu-west-3
hostnames:
  - tag:Name
  - dns-name
  - private-ip-address
keyed_groups:
  - prefix: kube
    key: ec2_tags.Kube_role
filters:
  tag:Project: epikube
compose:
  ansible_host: instance_id
  ansible_connection: "'aws_ssm'"
  ansible_aws_ssm_region: "'eu-west-3'"
  ansible_aws_ssm_bucket_name: "'ansible-bucket-epikube'"