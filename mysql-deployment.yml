apiVersion: v1
kind: Service
metadata:
  name: mysql-svc
  namespace: sampleapp
spec:
  selector:
    app: myapp
  ports:
  - port: 3306
    targetPort: 3306

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql-sts
  namespace: sampleapp
spec:
  selector:
    matchLabels:
      app: mysql
  serviceName: mysql-svc
  replicas: 2
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - image: mysql:9
        name: mysql
        env:
        - name: MYSQL_ROOT_PASSWORD
          value: root
        ports:
        - containerPort: 3306
          name: mysql
        volumeMounts:
        - name: mysql-pvc
          mountPath: /var/lib/mysql
  volumeClaimTemplates:
  - metadata:
      name: mysql-pvc
    spec:
      resources:
        requests:
          storage: 2Gi
      storageClassName: standard # on aurait utilisé mysql-ebs-sc mais là sur minikube y a le provisioner hostpath donc pr le local est sur hostpath 
      accessModes:
        - ReadWriteOnce
